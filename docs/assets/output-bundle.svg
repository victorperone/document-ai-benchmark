<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="680" height="480" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Output Bundle Structure</text>

  <!-- Root dir -->
  <rect x="260" y="50" width="160" height="36" rx="6" fill="#1e40af" />
  <text x="340" y="73" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">outputs/</text>

  <!-- Level 1: parser -->
  <line x1="340" y1="86" x2="340" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="240" y="110" width="200" height="32" rx="6" fill="#3b82f6"/>
  <text x="340" y="131" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">{parser}/</text>

  <!-- Level 2: document -->
  <line x1="340" y1="142" x2="340" y2="166" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="220" y="166" width="240" height="32" rx="6" fill="#6366f1"/>
  <text x="340" y="187" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">{document_id}/</text>

  <!-- Level 3: profile -->
  <line x1="340" y1="198" x2="340" y2="222" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="200" y="222" width="280" height="32" rx="6" fill="#7c3aed"/>
  <text x="340" y="243" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">{profile}/</text>

  <!-- Fan out lines -->
  <line x1="340" y1="254" x2="340" y2="278" stroke="#94a3b8" stroke-width="1"/>
  <!-- horizontal bar -->
  <line x1="60" y1="278" x2="620" y2="278" stroke="#94a3b8" stroke-width="1"/>

  <!-- 7 artifact leaves -->
  <!-- run.log -->
  <line x1="60"  y1="278" x2="60"  y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10"  y="298" width="100" height="52" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="60"  y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">run.log</text>
  <text x="60"  y="332" text-anchor="middle" font-size="9"   fill="#64748b">full stdout</text>
  <text x="60"  y="345" text-anchor="middle" font-size="9"   fill="#64748b">+ stderr log</text>

  <!-- raw.md -->
  <line x1="155" y1="278" x2="155" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="105" y="298" width="100" height="52" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">raw.md</text>
  <text x="155" y="332" text-anchor="middle" font-size="9"   fill="#64748b">parser output</text>
  <text x="155" y="345" text-anchor="middle" font-size="9"   fill="#64748b">before normalize</text>

  <!-- document.md -->
  <line x1="250" y1="278" x2="250" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="200" y="298" width="100" height="52" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">document.md</text>
  <text x="250" y="332" text-anchor="middle" font-size="9"   fill="#64748b">normalized</text>
  <text x="250" y="345" text-anchor="middle" font-size="9"   fill="#64748b">Markdown</text>

  <!-- document.enriched.md -->
  <line x1="340" y1="278" x2="340" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="285" y="298" width="110" height="52" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">document</text>
  <text x="340" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">.enriched.md</text>
  <text x="340" y="341" text-anchor="middle" font-size="9"   fill="#64748b">+ visual</text>
  <text x="340" y="353" text-anchor="middle" font-size="9"   fill="#64748b">descriptions</text>

  <!-- document.jsonl -->
  <line x1="430" y1="278" x2="430" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="378" y="298" width="104" height="52" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">document.jsonl</text>
  <text x="430" y="332" text-anchor="middle" font-size="9"   fill="#64748b">per-page JSON</text>
  <text x="430" y="345" text-anchor="middle" font-size="9"   fill="#64748b">for chunking</text>

  <!-- metrics.json -->
  <line x1="525" y1="278" x2="525" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="473" y="298" width="104" height="52" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="525" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">metrics.json</text>
  <text x="525" y="332" text-anchor="middle" font-size="9"   fill="#64748b">tokens · noise</text>
  <text x="525" y="345" text-anchor="middle" font-size="9"   fill="#64748b">resources · time</text>

  <!-- native/ -->
  <line x1="620" y1="278" x2="620" y2="298" stroke="#94a3b8" stroke-width="1"/>
  <rect x="568" y="298" width="104" height="52" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="317" text-anchor="middle" font-size="10" font-weight="700" fill="#065f46">native/</text>
  <text x="620" y="332" text-anchor="middle" font-size="9"   fill="#64748b">parser output</text>
  <text x="620" y="345" text-anchor="middle" font-size="9"   fill="#64748b">+ manifest.json</text>

  <!-- removed_content.jsonl (below metrics.json) -->
  <line x1="525" y1="350" x2="525" y2="370" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="462" y="370" width="126" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="525" y="386" text-anchor="middle" font-size="9.5" fill="#64748b">removed_content.jsonl</text>
  <text x="525" y="399" text-anchor="middle" font-size="9"   fill="#94a3b8">header/footer audit</text>

  <!-- Legend -->
  <text x="340" y="444" text-anchor="middle" font-size="10" fill="#64748b">Dashed = optional artifact (controlled by --artifacts flag)</text>

  <rect x="30" y="454" width="12" height="12" rx="2" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="48" y="465" font-size="10" fill="#64748b">always written</text>
  <rect x="180" y="454" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="198" y="465" font-size="10" fill="#64748b">optional (--artifacts)</text>
</svg>
